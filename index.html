<script>
window.DASH_DATA = (function () {
  const today = {
    date: '26/05/2569', dateEn: '26 May 2026',

      cutToday: { cost: 374.63, sales: 574 },
      cutAccum: { cost: 11973.52, sales: 17864.25 },
      delivery: {

    },

  const seed = (n) => { let s = n; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; };
  const rng = seed(42);
  const wiggle = (base, pct = 0.12) => base * (1 + (rng() - 0.5) * pct * 2);
  const round = (n, d = 2) => Math.round(n * 10 ** d) / 10 ** d;

  const dailyMay = [];
  for (let d = 1; d <= 26; d++) {
    const dow = (d + 3) % 7;
    const weekendBump = dow === 0 || dow === 6 ? 1.1 : 1.0;
    dailyMay.push({
      day: d, label: d.toString(),
      amazon: round(wiggle(20500, 0.18) * weekendBump),
      store: round(wiggle(58000, 0.15) * weekendBump),
      fuel: round(wiggle(520000, 0.14) * weekendBump),
      customers: Math.round(wiggle(650, 0.12) * weekendBump),
      liters: round(wiggle(12800, 0.12) * weekendBump),
      cups: Math.round(wiggle(280, 0.18) * weekendBump),
    });
  }
  dailyMay[25].amazon = today.amazon.grossSales;
  dailyMay[25].store = today.store.sales;
  dailyMay[25].fuel = today.fuel.total.amount;
  dailyMay[25].customers = today.store.customers;
  dailyMay[25].liters = today.fuel.total.liters;
  dailyMay[25].cups = today.amazon.cups;

  const monthly = [
    { key: 'mar', label: 'มี.ค. 69', labelEn: 'Mar',

    { key: 'apr', label: 'เม.ย. 69', labelEn: 'Apr',
      amazon: { sales: 638500, cups: 8760, target: 650000 },
      store:  { sales: 1812400, customers: 20140, target: 2480000 },
      fuel:   { amount: 16240000, liters: 388900, target: 16500000 } },
    { key: 'may', label: 'พ.ค. 69', labelEn: 'May',
      amazon: { sales: dailyMay.reduce((s, x) => s + x.amazon, 0), cups: dailyMay.reduce((s, x) => s + x.cups, 0), target: 650000 },
      store:  { sales: dailyMay.reduce((s, x) => s + x.store, 0), customers: dailyMay.reduce((s, x) => s + x.customers, 0), target: 2480000 },
      fuel:   { amount: dailyMay.reduce((s, x) => s + x.fuel, 0), liters: dailyMay.reduce((s, x) => s + x.liters, 0), target: 16500000 } },
  ];

  const lineMessages = [
    { id: 'm5', time: '21:48', source: 'รายงานน้ำมัน · กะดึก', business: 'fuel',   preview: 'รวม 13,267.249 ลิตร · 554,857.07 ฿', status: 'new' },
    { id: 'm4', time: '21:12', source: 'รายงาน Delivery 7-11 บ่าย', business: 'store', preview: '38 บิล · 6,333 ฿ · มาร์ค', status: 'new' },
    { id: 'm3', time: '20:55', source: 'รายงานยอดขาย · 18351', business: 'store', preview: 'ยอดขาย 55,385.05 / เป้า 80,000', status: 'read' },
    { id: 'm2', time: '20:30', source: 'รายงาน Amazon ปตท.สำเร็จพัฒนา', business: 'amazon', preview: 'ยอดขาย 22,565 ฿ · 295 แก้ว · 53 ชิ้น', status: 'read' },
    { id: 'm1', time: '13:22', source: 'รายงาน Delivery 7-11 เช้า', business: 'store', preview: '19 บิล · 3,164 ฿ · มาร์ค', status: 'read' },
    { id: 'm0', time: '08:05', source: 'รายงานน้ำมัน · กะเช้า', business: 'fuel',   preview: '8,327.067 ลิตร · 346,905.17 ฿', status: 'read' },
  ];

  const fuelByHour = [
    { h: '00', amount: 28000 }, { h: '02', amount: 22000 }, { h: '04', amount: 18000 },
    { h: '06', amount: 41000 }, { h: '08', amount: 68000 }, { h: '10', amount: 72000 },
    { h: '12', amount: 64000 }, { h: '14', amount: 51000 }, { h: '16', amount: 58000 },
    { h: '18', amount: 71000 }, { h: '20', amount: 49000 }, { h: '22', amount: 12000 },
  ];

  return {
    today, dailyMay, monthly, lineMessages, fuelByHour,
    fmt: {
      money: (n) => '฿' + Math.round(n).toLocaleString('en-US'),
      moneyShort: (n) => {
        if (Math.abs(n) >= 1e6) return '฿' + (n / 1e6).toFixed(2) + 'M';
        if (Math.abs(n) >= 1e3) return '฿' + (n / 1e3).toFixed(1) + 'K';
        return '฿' + Math.round(n);
      },
      num: (n) => Math.round(n).toLocaleString('en-US'),
      pct: (n) => (n >= 0 ? '+' : '') + n.toFixed(1) + '%',
    },
  };
})();

<script type="text/babel">
const { useState, useEffect } = React;

const BIZ = {
  amazon: { key: 'amazon', th: 'คาเฟ่ อเมซอน', en: 'Cafe Amazon',       color: '#0B6E4F', soft: '#E6F2EB', icon: '☕' },
  store:  { key: 'store',  th: 'ร้านสะดวกซื้อ', en: 'Convenience Store', color: '#C84B31', soft: '#FBEAE3', icon: '🏪' },
  fuel:   { key: 'fuel',   th: 'สถานีน้ำมัน',   en: 'Fuel Station',      color: '#1E3A5F', soft: '#E3E9F2', icon: '⛽' },
};

function Sparkline({ data, width = 200, height = 40, color = '#0B6E4F', fill = true, strokeWidth = 1.5 }) {
  if (!data || data.length === 0) return null;
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1; const pad = 2;
  const stepX = (width - pad * 2) / (data.length - 1);
  const points = data.map((v, i) => [pad + i * stepX, pad + (1 - (v - min) / range) * (height - pad * 2)]);
  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const areaD = pathD + ` L ${points[points.length - 1][0]} ${height - pad} L ${pad} ${height - pad} Z`;
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      {fill && <path d={areaD} fill={color} opacity={0.12} />}
      <path d={pathD} fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r={2.5} fill={color} />
    </svg>
  );
}

function BarChart({ data, width = 560, height = 220, color = '#1E3A5F', yFormat = (n) => n, padding = { l: 56, r: 12, t: 12, b: 28 }, barGap = 0.35 }) {
  const { l, r, t, b } = padding;
  const innerW = width - l - r, innerH = height - t - b;
  const max = Math.max(...data.map(d => d.value)) * 1.1 || 1;
  const stepX = innerW / data.length;
  const bw = stepX * (1 - barGap);
  const yTicks = 4;
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      {Array.from({ length: yTicks + 1 }, (_, i) => {
        const v = (max * i) / yTicks; const y = t + (1 - i / yTicks) * innerH;
        return (
          <g key={i}>
            <line x1={l} x2={l + innerW} y1={y} y2={y} stroke="#E5E7EB" strokeWidth={1} strokeDasharray={i === 0 ? '0' : '2 3'} />
            <text x={l - 8} y={y + 3} fontSize={10} fill="#6B7280" textAnchor="end">{yFormat(v)}</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const x = l + i * stepX + (stepX - bw) / 2;
        const h = (d.value / max) * innerH;
        const y = t + innerH - h;
        return (
          <g key={i}>
            <rect x={x} y={y} width={bw} height={h} fill={color} rx={2} />
            <text x={l + i * stepX + stepX / 2} y={t + innerH + 14} fontSize={10} fill="#6B7280" textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function Progress({ value, target, color = '#0B6E4F', height = 6, showLabel = true, fmt = (n) => n }) {
  const pct = Math.min(100, (value / target) * 100);
  return (
    <div>
      <div style={{ position: 'relative', height, background: '#F3F4F6', borderRadius: height / 2, overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, width: `${pct}%`, background: color, borderRadius: height / 2, transition: 'width .6s ease' }} />
      </div>
      {showLabel && (
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 11, color: '#6B7280' }}>
          <span>{fmt(value)} <span style={{ color: '#9CA3AF' }}>/ {fmt(target)}</span></span>
          <span style={{ color, fontWeight: 600 }}>{pct.toFixed(1)}%</span>
        </div>
      )}
    </div>
  );
}

function PillButton({ children, icon, dark, onClick }) {
  return (
    <button onClick={onClick} style={{
      border: '1px solid ' + (dark ? '#334155' : '#E5E7EB'),
      background: dark ? '#1E293B' : '#fff',
      color: dark ? '#F1F5F9' : '#374151',
      borderRadius: 6, padding: '6px 12px', fontSize: 12, fontWeight: 500,
      display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', fontFamily: 'inherit',
    }}>
      {icon && <span style={{ fontSize: 12 }}>{icon}</span>}
      <span>{children}</span>
    </button>
  );
}

function TopBar({ title, subtitle, dateState }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '16px 28px', background: '#fff',
      borderBottom: '1px solid #E5E7EB', color: '#111827', flexShrink: 0,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{ width: 36, height: 36, borderRadius: 6, background: 'linear-gradient(135deg, #1E3A5F, #0B6E4F)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 700, fontSize: 13 }}>PTT</div>
        <div>
          <div style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.2 }}>{title}</div>
          {subtitle && <div style={{ fontSize: 11, color: '#6B7280', marginTop: 2 }}>{subtitle}</div>}
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        {dateState && (
          <DateSelector
            value={dateState.selectedDate}
            onChange={dateState.setSelectedDate}
            min={dateState.availableDates && dateState.availableDates[0]}
            max={dateState.availableDates && dateState.availableDates[dateState.availableDates.length - 1]}
          />
        )}
        <PillButton icon="⬇">Export</PillButton>
        <div
          onClick={() => { if (typeof window.__pttLogout === 'function' && window.confirm('ออกจากระบบ?')) window.__pttLogout(); }}
          title="ออกจากระบบ · Logout"
          style={{ width: 32, height: 32, borderRadius: 16, background: '#E5E7EB', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 600, color: '#374151', cursor: 'pointer', userSelect: 'none' }}>AS</div>
      </div>
    </div>
  );
}

function LineFeed({ messages, compact = false }) {
  const [list, setList] = useState(messages);
  const [pulse, setPulse] = useState(null);
  useEffect(() => {
    const id = setInterval(() => {
      const samples = [
        { source: 'รายงานน้ำมัน · กะเย็น',     preview: 'ลิตร 1,240 · 51,608 ฿',   business: 'fuel' },
        { source: 'รายงาน Delivery 7-11 ค่ำ', preview: '14 บิล · 2,310 ฿',         business: 'store' },
        { source: 'รายงาน Amazon · รอบสรุป',  preview: '+ 18 แก้ว · 4 ชิ้น เบเกอรี่', business: 'amazon' },
      ];
      const pick = samples[Math.floor(Math.random() * samples.length)];
      const newMsg = { ...pick, id: 'live-' + Date.now(), time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }), status: 'new' };
      setList((prev) => [newMsg, ...prev].slice(0, 8));
      setPulse(newMsg.id);
      setTimeout(() => setPulse(null), 1600);
    }, 12000);
    return () => clearInterval(id);
  }, []);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: compact ? 4 : 6, overflow: 'auto' }}>
      {list.map((m) => {
        const biz = BIZ[m.business]; const isPulse = pulse === m.id;
        return (
          <div key={m.id} style={{
            display: 'flex', alignItems: 'flex-start', gap: 10,
            padding: compact ? '8px 10px' : '10px 12px',
            background: (m.status === 'new' || isPulse) ? '#FFFDF7' : '#fff',
            border: '1px solid #F1F2EE', borderRadius: 6, transition: 'background .3s',
            boxShadow: isPulse ? `0 0 0 2px ${biz.color}55` : 'none',
          }}>
            <div style={{ width: 28, height: 28, borderRadius: 4, background: biz.soft, color: biz.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, flexShrink: 0 }}>{biz.icon}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: '#111827', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.source}</div>
                <div style={{ fontSize: 10, color: '#9CA3AF', flexShrink: 0 }}>{m.time}</div>
              </div>
              <div style={{ fontSize: 11, color: '#6B7280', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.preview}</div>
            </div>
            {(m.status === 'new' || isPulse) && (<div style={{ width: 6, height: 6, borderRadius: 3, background: '#22C55E', flexShrink: 0, marginTop: 8 }} />)}
          </div>
        );
      })}
    </div>
  );
}

Object.assign(window, { BIZ, Sparkline, BarChart, Progress, TopBar, PillButton, LineFeed });
</script>

<!-- =================== PARSER (LINE message → structured data) =================== -->
<script>
(function () {
  // Parse a number with optional commas: "22,565" → 22565, "13,267.249" → 13267.249
  const num = (s) => {
    if (s == null) return null;
    const cleaned = String(s).replace(/[,\s]/g, '');
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  };

  // Find first number after a label regex. Label is matched as a prefix; the next number on the same or next line is captured.
  const grab = (text, labelRe) => {
    const re = new RegExp(labelRe.source + '[^\\d-]{0,20}([\\d,]+(?:\\.\\d+)?)', labelRe.flags || 'i');
    const m = text.match(re);
    return m ? num(m[1]) : null;
  };

  // Buddhist year (2569) → CE year (2026)
  const beToAd = (y) => (y > 2400 ? y - 543 : y);

  // Extract Thai/Western date → "YYYY-MM-DD" (Gregorian). Returns null if not found.
  function extractDate(text) {
    // dd/mm/yyyy (Buddhist or Gregorian)
    let m = text.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})/);
    if (m) {
      const d = +m[1], mo = +m[2], y = beToAd(+m[3]);
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    // "26 พฤษภาคม 2569" or "26 พฤศภาคม 2569" (with typo)
    const months = { 'มกราคม':1, 'กุมภาพันธ์':2, 'มีนาคม':3, 'เมษายน':4, 'พฤษภาคม':5, 'พฤศภาคม':5, 'มิถุนายน':6, 'กรกฎาคม':7, 'สิงหาคม':8, 'กันยายน':9, 'ตุลาคม':10, 'พฤศจิกายน':11, 'ธันวาคม':12 };
    const monthRe = Object.keys(months).join('|');
    m = text.match(new RegExp(`(\\d{1,2})\\s+(${monthRe})\\s+(\\d{4})`));
    if (m) {
      const d = +m[1], mo = months[m[2]], y = beToAd(+m[3]);
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    return null;
  }

  // Detect which business a chunk of text describes
  function detectBusiness(text) {
    const t = text;
    if (/อเมซอน|ยอดแก้ว|Bakery|พรีเมียม/i.test(t) && /ยอดขายทั้งหมด|ยอดขายหลังหัก|ยอดเงินสด/i.test(t)) return 'amazon';
    if (/น้ำมัน.*กะ\s*(เช้า|ดึก)|ลิตร.*บาท|น้ำมันหล่อลื่น/i.test(t)) return 'fuel';
    if (/18351|เป้าหมายยอดขาย|เฉลี่ยลูกค้า|ต่อหัว|Delivery\s*7-?11|ตัดจ่าย/i.test(t)) return 'store';
    return null;
  }

  // Split a combined paste into per-business chunks. Returns [{ business, text }].
  function splitChunks(raw) {
    // Try to split on common separators or on business keywords. Simple approach: scan whole text,
    // try parsing as a whole first; if multi-business signals are present, split on known headers.
    const text = raw.trim();
    const markers = [
      { biz: 'amazon', re: /(?:^|\n)[^\n]*(?:ยอดขายประจำเดือน|อเมซอน\s*ปตท|☕)[^\n]*/ },
      { biz: 'store',  re: /(?:^|\n)[^\n]*(?:รายงานยอดขาย|18351\s*ปตท|🌴|🌻)[^\n]*/ },
      { biz: 'fuel',   re: /(?:^|\n)[^\n]*(?:สรุปยอดขายน้ำมัน|ยอดขายน้ำมัน\s*กะ)[^\n]*/ },
    ];
    const found = [];
    for (const mk of markers) {
      const m = text.match(mk.re);
      if (m) found.push({ biz: mk.biz, idx: m.index });
    }
    if (found.length === 0) {
      // single business — detect & return
      const b = detectBusiness(text);
      return b ? [{ business: b, text }] : [];
    }
    found.sort((a, b) => a.idx - b.idx);
    const chunks = [];
    for (let i = 0; i < found.length; i++) {
      const start = found[i].idx;
      const end = i + 1 < found.length ? found[i + 1].idx : text.length;
      chunks.push({ business: found[i].biz, text: text.slice(start, end).trim() });
    }
    return chunks;
  }

  function parseAmazon(text) {
    return {
      grossSales: grab(text, /ยอดขายทั้งหมด/),
      netSales: grab(text, /ยอดขายหลังหัก(?:ส่วนลด)?/),
      cash: grab(text, /ยอดเงินสด/),
      cups: grab(text, /ยอดแก้ว/),
      bakery: grab(text, /Bakery/i),
      premium: {
        qty: (() => { const m = text.match(/Premium\s+(\d+)\s*ชิ้น/i); return m ? +m[1] : null; })(),
        amount: grab(text, /Premium[^\n]*ยอดเงิน/i),
      },
      others: grab(text, /อื่นๆ/),
      totalItems: grab(text, /^\s*รวม\s/m),
    };
  }

  function parseStore(text) {
    const morningBills = (() => { const m = text.match(/เช้าได้\s*=\s*(\d+)\s*บิล/); return m ? +m[1] : null; })();
    const morningAmount = grab(text, /เช้าได้[\s\S]{0,80}?จำนวนเงิน/);
    const afternoonBills = (() => { const m = text.match(/บ่ายได้\s*=\s*(\d+)\s*บิล/); return m ? +m[1] : null; })();
    const afternoonAmount = grab(text, /บ่ายได้[\s\S]{0,80}?จำนวนเงิน/);
    const totalBills = (() => { const m = text.match(/รวมทั้งหมด\s*=\s*(\d+)\s*บิล/); return m ? +m[1] : null; })();
    const totalAmount = grab(text, /ยอดเงินรวม/);

    return {
      code: (() => { const m = text.match(/(\d{5})\s*ปตท/); return m ? m[1] : null; })(),
      target: grab(text, /เป้าหมายยอดขาย/),
      sales: grab(text, /^ยอดขาย\s*=/m) ?? grab(text, /ยอดขาย\s*=/),
      avgSales: grab(text, /ยอดเฉลี่ย/),
      customers: grab(text, /^ลูกค้า\s*=/m) ?? grab(text, /ลูกค้า\s*=/),
      avgCustomers: grab(text, /เฉลี่ยลูกค้า/),
      perHead: grab(text, /ต่อหัว/),
      cutToday: {
        cost: grab(text, /ตัดจ่าย\(วัน\)[\s\S]{0,40}?ทุน/),
        sales: grab(text, /ตัดจ่าย\(วัน\)[\s\S]{0,80}?ขาย/),
      },
      cutAccum: {
        cost: grab(text, /\(ตัดจ่ายสะสม\)[\s\S]{0,40}?ทุน/),
        sales: grab(text, /\(ตัดจ่ายสะสม\)[\s\S]{0,80}?ขาย/),
      },
      delivery: {
        morning: { bills: morningBills, amount: morningAmount },
        afternoon: { bills: afternoonBills, amount: afternoonAmount },
        total: { bills: totalBills, amount: totalAmount },
      },
    };
  }

  function parseFuel(text) {
    const morningLiters = grab(text, /กะ\s*เช้า/);
    // grab amount after "กะ เช้า ... ยอดเงิน"
    const mMorn = text.match(/กะ\s*เช้า[\s\S]{0,120}?ยอดเงิน\s*([\d,]+(?:\.\d+)?)/);
    const morningAmount = mMorn ? num(mMorn[1]) : null;

    const nightLiters = grab(text, /กะ\s*ดึก/);
    const mNight = text.match(/กะ\s*ดึก[\s\S]{0,120}?ยอดเงิน\s*([\d,]+(?:\.\d+)?)/);
    const nightAmount = mNight ? num(mNight[1]) : null;

    const lubUnits = grab(text, /น้ำมันหล่อลื่น/);
    const mLub = text.match(/น้ำมันหล่อลื่น[\s\S]{0,80}?ยอดเงิน\s*([\d,]+(?:\.\d+)?)/);
    const lubAmount = mLub ? num(mLub[1]) : null;

    const totalLiters = grab(text, /รวมลิตร/);
    const totalAmount = grab(text, /รวมเป็นเงิน/);

    return {
      morning: { liters: morningLiters, amount: morningAmount },
      night: { liters: nightLiters, amount: nightAmount },
      lubricant: { units: lubUnits, amount: lubAmount },
      total: { liters: totalLiters, amount: totalAmount },
    };
  }

  function parseAll(raw) {
    const chunks = splitChunks(raw);
    const date = extractDate(raw);
    const results = [];
    for (const c of chunks) {
      let parsed = null;
      if (c.business === 'amazon') parsed = parseAmazon(c.text);
      else if (c.business === 'store') parsed = parseStore(c.text);
      else if (c.business === 'fuel') parsed = parseFuel(c.text);
      if (parsed) results.push({ business: c.business, date, rawText: c.text, parsed });
    }
    return { date, results };
  }

  window.LineParser = { parseAll, parseAmazon, parseStore, parseFuel, splitChunks, extractDate, detectBusiness };
})();
</script>

<!-- =================== FIRESTORE STORE =================== -->
<script>
(function () {
  let db = null;
  const hasConfig = !window.__noFirebaseConfig && typeof window.FIREBASE_CONFIG === 'object' && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId;
  if (hasConfig && window.firebase) {
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      db = firebase.firestore();
    } catch (e) {
      console.error('Firebase init failed:', e);
    }
  }
  const listeners = new Set();
  let cache = []; // array of { id, business, date, parsed, rawText, createdAt }

  function emit() { listeners.forEach((fn) => fn(cache)); }

  function subscribe(cb) {
    listeners.add(cb);
    cb(cache);
    return () => listeners.delete(cb);
  }

  let unsubFs = null;
  function startSubscription() {
    if (!db || unsubFs) return;
    unsubFs = db.collection('reports').orderBy('date', 'desc').limit(4000).onSnapshot(
      (snap) => {
        cache = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        emit();
      },
      (err) => console.error('Firestore subscribe error:', err),
    );
  }

  async function saveReport({ business, date, parsed, rawText }) {
    if (!db) throw new Error('Firebase ไม่ได้ตั้งค่า — แก้ firebase-config.js ก่อน');
    const id = `${date}_${business}`;
    await db.collection('reports').doc(id).set({
      business, date, parsed, rawText,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  }

  window.ReportsStore = {
    isReady: () => !!db,
    subscribe,
    startSubscription,
    saveReport,
    getToday: (business) => {
      const today = new Date().toISOString().slice(0, 10);
      return cache.find((r) => r.business === business && r.date === today) || null;
    },
    getByDate: (business, date) => cache.find((r) => r.business === business && r.date === date) || null,
    getAll: () => cache,
  };

  if (db) startSubscription();
})();
</script>

function AddDataModal({ open, onClose }) {
  const [text, setText] = React.useState('');
  const [preview, setPreview] = React.useState(null);
  const [status, setStatus] = React.useState(null); // 'saving' | 'ok' | 'err'
  const [errMsg, setErrMsg] = React.useState('');

  React.useEffect(() => {
    if (!open) { setText(''); setPreview(null); setStatus(null); setErrMsg(''); }
  }, [open]);

  function doParse() {
    if (!text.trim()) { setPreview(null); return; }
    try {
      const out = window.LineParser.parseAll(text);
      setPreview(out);
    } catch (e) {
      setErrMsg(String(e));
    }
  }

  async function doSave() {
    if (!preview || preview.results.length === 0) return;
    if (!preview.date) { setErrMsg('ไม่พบวันที่ในข้อความ — กรุณาตรวจสอบ'); return; }
    setStatus('saving'); setErrMsg('');
    try {
      for (const r of preview.results) {
        await window.ReportsStore.saveReport({
          business: r.business, date: preview.date,
          parsed: r.parsed, rawText: r.rawText,
        });
      }
      setStatus('ok');
      setTimeout(() => onClose && onClose(), 1200);
    } catch (e) {
      setStatus('err'); setErrMsg(e.message || String(e));
    }

  if (!open) return null;
  const fbReady = window.ReportsStore && window.ReportsStore.isReady();

  return (
    <div style={{
      position: 'fixed', inset: 0, background: 'rgba(15,23,42,0.55)',

      padding: 20, animation: 'fadeIn .15s ease',
    }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: '#fff', borderRadius: 12, width: '100%', maxWidth: 720, maxHeight: '90vh',
        display: 'flex', flexDirection: 'column', overflow: 'hidden',
        animation: 'slideUp .2s ease',
        fontFamily: '"IBM Plex Sans Thai", "IBM Plex Sans", system-ui, sans-serif',
      }}>
        <div style={{ padding: '18px 22px', borderBottom: '1px solid #E5E7EB', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 600, color: '#111827' }}>วางข้อความจาก LINE</div>
            <div style={{ fontSize: 11, color: '#6B7280', marginTop: 2 }}>ระบบจะ parse + บันทึกลง Firestore ให้อัตโนมัติ</div>
          </div>
          <button onClick={onClose} style={{ border: 'none', background: 'transparent', fontSize: 22, color: '#9CA3AF', cursor: 'pointer', padding: 4 }}>×</button>
        </div>

        <div style={{ padding: '16px 22px', overflow: 'auto', flex: 1 }}>
          {!fbReady && (
            <div style={{ background: '#FEF3C7', border: '1px solid #FCD34D', color: '#92400E', padding: '10px 14px', borderRadius: 6, fontSize: 12, marginBottom: 12 }}>
              ⚠ Firebase ยังไม่ได้ตั้งค่า — parse ดูได้แต่ save ไม่ได้ ดูวิธีตั้งค่าใน README.md
            </div>
          )}
          <textarea value={text} onChange={(e) => { setText(e.target.value); setPreview(null); }} placeholder="วางข้อความรายงานยอดขายจาก LINE ที่นี่... รองรับ Amazon / 18351 (ร้านสะดวกซื้อ) / น้ำมัน  วางพร้อมกันหลายธุรกิจได้"
            style={{
              width: '100%', minHeight: 180, padding: 12, fontSize: 13, lineHeight: 1.5,
              border: '1px solid #E5E7EB', borderRadius: 6, resize: 'vertical',
              fontFamily: 'inherit', color: '#111827', background: '#FAFAF8',
            }} />

          <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
            <button onClick={doParse} disabled={!text.trim()} style={btnStyle('#1E3A5F', !text.trim())}>1. ดูตัวอย่าง parse</button>
            <button onClick={doSave} disabled={!preview || preview.results.length === 0 || status === 'saving' || !fbReady} style={btnStyle('#0B6E4F', !preview || preview.results.length === 0 || status === 'saving' || !fbReady)}>
              {status === 'saving' ? 'กำลังบันทึก…' : status === 'ok' ? '✓ บันทึกแล้ว' : '2. บันทึกลง Firestore'}
            </button>
          </div>

          {errMsg && <div style={{ marginTop: 10, fontSize: 12, color: '#C84B31' }}>{errMsg}</div>}

          {preview && (
            <div style={{ marginTop: 16, paddingTop: 16, borderTop: '1px solid #F3F4F6' }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: '#111827', marginBottom: 8 }}>

              </div>
              {preview.results.length === 0 && (
                <div style={{ fontSize: 12, color: '#C84B31' }}>ไม่พบข้อมูลที่ parse ได้ — ลองตรวจรูปแบบข้อความ</div>

}

function btnStyle(color, disabled) {

// Hook: subscribe to Firestore reports + manage selectedDate.
// When reports or selectedDate change: rewrite window.DASH_DATA.today and dailyMay accordingly.
// Returns { reports, selectedDate, setSelectedDate, availableDates, latestDate }
function useReportsState() {
  const [reports, setReports] = React.useState(() => (window.ReportsStore && window.ReportsStore.getAll()) || []);
  const [selectedDate, setSelectedDate] = React.useState(null);
  const [tick, setTick] = React.useState(0); // force re-render after mutating DASH_DATA

  React.useEffect(() => {
    if (!window.ReportsStore) return;
    const unsub = window.ReportsStore.subscribe(setReports);
    return unsub;
  }, []);

  const availableDates = React.useMemo(
    () => [...new Set(reports.map((r) => r.date))].sort(),
    [reports]
  );
  const latestDate = availableDates[availableDates.length - 1] || null;

  // Auto-pick latest date once data arrives (only if user hasn't manually picked yet)
  React.useEffect(() => {
    if (!selectedDate && latestDate) setSelectedDate(latestDate);
  }, [latestDate, selectedDate]);

  // Apply data for selectedDate into DASH_DATA
  React.useEffect(() => {
    const D = window.DASH_DATA;
    if (!D || !selectedDate) return;

    // 1. Set today's per-business data
    for (const biz of ['amazon', 'store', 'fuel']) {
      const r = reports.find((x) => x.business === biz && x.date === selectedDate);
      if (r && r.parsed) {
        D.today[biz] = { ...D.today[biz], ...r.parsed };
        // Patch nested objects so missing nested fields fall back to mock instead of breaking
        if (biz === 'fuel' && r.parsed.total) D.today.fuel.total = { ...D.today.fuel.total, ...r.parsed.total };
        if (biz === 'fuel' && r.parsed.morning) D.today.fuel.morning = { ...D.today.fuel.morning, ...r.parsed.morning };
        if (biz === 'fuel' && r.parsed.night) D.today.fuel.night = { ...D.today.fuel.night, ...r.parsed.night };
        if (biz === 'fuel' && r.parsed.lubricant) D.today.fuel.lubricant = { ...D.today.fuel.lubricant, ...r.parsed.lubricant };
        if (biz === 'store' && r.parsed.delivery) D.today.store.delivery = { ...D.today.store.delivery, ...r.parsed.delivery };
        if (biz === 'store' && r.parsed.cutToday) D.today.store.cutToday = { ...D.today.store.cutToday, ...r.parsed.cutToday };
        if (biz === 'store' && r.parsed.cutAccum) D.today.store.cutAccum = { ...D.today.store.cutAccum, ...r.parsed.cutAccum };
        if (biz === 'amazon' && r.parsed.premium) D.today.amazon.premium = { ...D.today.amazon.premium, ...r.parsed.premium };
      }
    }
    D.today.date = selectedDate.split('-').reverse().join('/');

    // 2. Build 26-day series ending at selectedDate (real data, fallback 0 for missing days)
    const endDate = new Date(selectedDate + 'T00:00:00');
    const series = [];
    for (let i = 25; i >= 0; i--) {
      const d = new Date(endDate);
      d.setDate(endDate.getDate() - i);
      const iso = d.toISOString().slice(0, 10);
      const amz = reports.find((x) => x.business === 'amazon' && x.date === iso);
      const sto = reports.find((x) => x.business === 'store'  && x.date === iso);
      const ful = reports.find((x) => x.business === 'fuel'   && x.date === iso);
      series.push({
        day: d.getDate(),
        label: String(d.getDate()),
        amazon:    amz?.parsed?.grossSales || 0,
        store:     sto?.parsed?.sales       || 0,
        fuel:      ful?.parsed?.total?.amount || 0,
        liters:    ful?.parsed?.total?.liters || 0,
        customers: sto?.parsed?.customers   || 0,
        cups:      amz?.parsed?.cups        || 0,
      });
    }
    D.dailyMay = series;

    setTick((t) => t + 1);
  }, [reports, selectedDate]);

  return { reports, selectedDate, setSelectedDate, availableDates, latestDate, tick };
}

// Compact date selector — uses native <input type="date"> but shows Thai label
function DateSelector({ value, onChange, min, max, dark }) {
  const ref = React.useRef(null);
  const display = React.useMemo(() => {
    if (!value) return '— เลือกวัน —';
    const [y, mo, d] = value.split('-');
    const monthsTh = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    return `${parseInt(d)} ${monthsTh[parseInt(mo) - 1]} ${(+y) + 543}`;
  }, [value]);

  function openPicker() {
    if (!ref.current) return;
    if (ref.current.showPicker) try { ref.current.showPicker(); return; } catch (e) {}
    ref.current.focus();
    ref.current.click();
  }

  return (
    <button type="button" onClick={openPicker} style={{
      border: '1px solid ' + (dark ? '#334155' : '#E5E7EB'),
      background: dark ? '#1E293B' : '#fff',
      color: dark ? '#F1F5F9' : '#374151',
      borderRadius: 6, padding: '6px 12px', fontSize: 12, fontWeight: 600,
      display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer',
      fontFamily: 'inherit', position: 'relative',
    }}>
      <span style={{ fontSize: 13 }}>📅</span>
      <span>{display}</span>
      <span style={{ fontSize: 9, color: '#9CA3AF', marginLeft: 4 }}>▾</span>
      <input
        ref={ref}
        type="date"
        value={value || ''}

        }}

}

// Trend comparison: last 30 days (ending at endDate) vs prior 30 days
function TrendCompare({ reports, endDate, compact = false }) {
  const stats = React.useMemo(() => {
    if (!endDate || !reports || !reports.length) return null;
    const end = new Date(endDate + 'T00:00:00');
    const last30Start = new Date(end); last30Start.setDate(end.getDate() - 29);
    const prev30End = new Date(last30Start); prev30End.setDate(last30Start.getDate() - 1);
    const prev30Start = new Date(prev30End); prev30Start.setDate(prev30End.getDate() - 29);
    const inRange = (dateStr, start, finish) => {
      const d = new Date(dateStr + 'T00:00:00');
      return d >= start && d <= finish;
    };
    function sumIn(business, fn, startD, finishD) {
      let sum = 0, days = 0;
      for (const r of reports) {
        if (r.business !== business) continue;
        if (!inRange(r.date, startD, finishD)) continue;
        const v = fn(r);
        if (v != null) { sum += v; days++; }
      }
      return { sum, days };
    }
    const lines = [
      { key: 'amazon', label: 'คาเฟ่ อเมซอน', en: 'Cafe Amazon', color: BIZ.amazon.color, icon: '☕', fn: (r) => r.parsed.grossSales },
      { key: 'store',  label: 'ร้านสะดวกซื้อ', en: '7-Eleven',    color: BIZ.store.color,  icon: '🏪', fn: (r) => r.parsed.sales },
      { key: 'fuel',   label: 'น้ำมัน',        en: 'Fuel',        color: BIZ.fuel.color,   icon: '⛽', fn: (r) => r.parsed.total?.amount },
    ];
    return lines.map((L) => {
      const cur = sumIn(L.key, L.fn, last30Start, end);
      const prv = sumIn(L.key, L.fn, prev30Start, prev30End);
      const delta = prv.sum > 0 ? ((cur.sum - prv.sum) / prv.sum) * 100 : 0;
      return { ...L, cur: cur.sum, prv: prv.sum, days: cur.days, delta };
    });
  }, [reports, endDate]);

  const D = window.DASH_DATA;
  if (!stats) return null;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: compact ? 8 : 10 }}>
      {stats.map((s) => {
        const isUp = s.delta >= 0;
        const arrow = isUp ? '▲' : '▼';
        const deltaColor = isUp ? '#0B6E4F' : '#C84B31';
        const maxBar = Math.max(s.cur, s.prv) || 1;
        const curW = (s.cur / maxBar) * 100;
        const prvW = (s.prv / maxBar) * 100;
        return (
          <div key={s.key} style={{ padding: compact ? '10px 12px' : '12px 14px', background: '#FAFAF8', border: '1px solid #F1F2EE', borderRadius: 6 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 14 }}>{s.icon}</span>
                <div>
                  <div style={{ fontSize: 11, fontWeight: 600, color: '#111827' }}>{s.label}</div>
                  <div style={{ fontSize: 9, color: '#9CA3AF' }}>{s.en} · {s.days} วัน</div>
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: s.color, fontFeatureSettings: '"tnum"' }}>{D.fmt.moneyShort(s.cur)}</div>
                <div style={{ fontSize: 10, color: deltaColor, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 3 }}>
                  <span>{arrow}</span><span>{Math.abs(s.delta).toFixed(1)}%</span>
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 9, color: '#6B7280', width: 38 }}>30 วันนี้</span>
                <div style={{ flex: 1, height: 5, background: '#F3F4F6', borderRadius: 3, overflow: 'hidden' }}>
                  <div style={{ width: `${curW}%`, height: '100%', background: s.color }} />
                </div>
                <span style={{ fontSize: 9, color: '#6B7280', minWidth: 56, textAlign: 'right', fontFeatureSettings: '"tnum"' }}>{D.fmt.moneyShort(s.cur)}</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 9, color: '#9CA3AF', width: 38 }}>ก่อนหน้า</span>
                <div style={{ flex: 1, height: 5, background: '#F3F4F6', borderRadius: 3, overflow: 'hidden' }}>
                  <div style={{ width: `${prvW}%`, height: '100%', background: s.color, opacity: 0.4 }} />
                </div>
                <span style={{ fontSize: 9, color: '#9CA3AF', minWidth: 56, textAlign: 'right', fontFeatureSettings: '"tnum"' }}>{D.fmt.moneyShort(s.prv)}</span>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// Monthly MTD: current month-to-date totals + daily breakdown bars + comparison to same period last month
function MonthlyMTD({ reports, endDate, compact = false }) {
  const data = React.useMemo(() => {
    if (!endDate || !reports || !reports.length) return null;
    const end = new Date(endDate + 'T00:00:00');
    const y = end.getFullYear(), m = end.getMonth(), dayOfMonth = end.getDate();
    const monthStart = new Date(y, m, 1);
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevMonthY = m === 0 ? y - 1 : y;
    const prevMonthM = m === 0 ? 11 : m - 1;
    const prevMonthDays = new Date(prevMonthY, prevMonthM + 1, 0).getDate();

    const pad = (n) => String(n).padStart(2, '0');
    const isoOf = (yy, mm, dd) => `${yy}-${pad(mm + 1)}-${pad(dd)}`;

    function dailyArray(business, fn, year, month, days) {
      const arr = new Array(days).fill(null);
      for (const r of reports) {
        if (r.business !== business) continue;
        if (!r.date.startsWith(`${year}-${pad(month + 1)}-`)) continue;
        const d = +r.date.slice(8, 10);
        if (d >= 1 && d <= days) {
          const v = fn(r);
          if (v != null) arr[d - 1] = (arr[d - 1] || 0) + v;
        }
      }
      return arr;
    }

    const lines = [
      { key: 'amazon', label: 'คาเฟ่ อเมซอน', en: 'Cafe Amazon', color: BIZ.amazon.color, icon: '☕', fn: (r) => r.parsed.grossSales },
      { key: 'store',  label: 'ร้านสะดวกซื้อ', en: '7-Eleven',    color: BIZ.store.color,  icon: '🏪', fn: (r) => r.parsed.sales },
      { key: 'fuel',   label: 'น้ำมัน',        en: 'Fuel',         color: BIZ.fuel.color,  icon: '⛽', fn: (r) => r.parsed.total?.amount },
    ];

    return lines.map((L) => {
      const curDaily = dailyArray(L.key, L.fn, y, m, daysInMonth);
      const prvDaily = dailyArray(L.key, L.fn, prevMonthY, prevMonthM, prevMonthDays);
      const curMtd = curDaily.slice(0, dayOfMonth).reduce((s, v) => s + (v || 0), 0);
      // Same calendar-day window in previous month (clamp to its length)
      const prvSameWindow = prvDaily.slice(0, Math.min(dayOfMonth, prevMonthDays)).reduce((s, v) => s + (v || 0), 0);
      const prvFull = prvDaily.reduce((s, v) => s + (v || 0), 0);
      const delta = prvSameWindow > 0 ? ((curMtd - prvSameWindow) / prvSameWindow) * 100 : 0;
      return {
        ...L,
        curDaily, prvDaily, curMtd, prvSameWindow, prvFull, delta,
        daysInMonth, dayOfMonth, monthLabel: `${THAI_MONTH_ABBR[m]} ${y + 543}`, prvMonthLabel: `${THAI_MONTH_ABBR[prevMonthM]} ${prevMonthY + 543}`,
      };
    });
  }, [reports, endDate]);

  const D = window.DASH_DATA;
  if (!data) return null;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: compact ? 10 : 12 }}>
      {data.map((s) => {
        const isUp = s.delta >= 0;
        const arrow = isUp ? '▲' : '▼';
        const deltaColor = isUp ? '#0B6E4F' : '#C84B31';
        const maxCur = Math.max(...s.curDaily.map((v) => v || 0)) || 1;
        // bars: full month width (daysInMonth bars), days with data = colored, future days = empty, selectedDay = highlighted
        return (
          <div key={s.key} style={{ padding: '12px 14px', background: '#FAFAF8', border: '1px solid #F1F2EE', borderRadius: 6 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 14 }}>{s.icon}</span>
                <div>
                  <div style={{ fontSize: 11, fontWeight: 600, color: '#111827' }}>{s.label}</div>
                  <div style={{ fontSize: 9, color: '#9CA3AF' }}>{s.monthLabel} · {s.dayOfMonth}/{s.daysInMonth} วัน</div>
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: s.color, fontFeatureSettings: '"tnum"' }}>{D.fmt.moneyShort(s.curMtd)}</div>
                <div style={{ fontSize: 10, color: deltaColor, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 3 }}>
                  <span>{arrow}</span><span>{Math.abs(s.delta).toFixed(1)}%</span>
                  <span style={{ color: '#9CA3AF', fontWeight: 400, marginLeft: 3 }}>vs {s.prvMonthLabel}</span>
                </div>
              </div>
            </div>

            {/* Daily mini-bars */}
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 1, height: 36, paddingTop: 2 }}>
              {s.curDaily.map((v, i) => {
                const d = i + 1;
                const isToday = d === s.dayOfMonth;
                const isFuture = d > s.dayOfMonth;
                const h = v ? Math.max(2, (v / maxCur) * 32) : 0;
                return (
                  <div key={i} style={{ flex: 1, position: 'relative', height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }} title={`${d} · ${v != null ? D.fmt.moneyShort(v) : 'ไม่มีข้อมูล'}`}>
                    <div style={{
                      height: h,
                      background: isFuture ? '#F3F4F6' : (isToday ? '#0F172A' : s.color),
                      opacity: isFuture ? 0.5 : (v ? 1 : 0.15),
                      borderRadius: '1px 1px 0 0',
                      transition: 'height .3s',
                    }} />
                  </div>
                );
              })}
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#9CA3AF', marginTop: 4 }}>
              <span>1</span>
              <span style={{ color: '#0F172A', fontWeight: 600 }}>{s.dayOfMonth}</span>
              <span>{s.daysInMonth}</span>
            </div>

            {/* Bottom comparison row */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8, paddingTop: 8, borderTop: '1px dashed #E5E7EB', fontSize: 10 }}>
              <span style={{ color: '#6B7280' }}>{s.prvMonthLabel} ({s.dayOfMonth} วันแรก): <strong style={{ color: '#111827', fontFeatureSettings: '"tnum"' }}>{D.fmt.moneyShort(s.prvSameWindow)}</strong></span>
              <span style={{ color: '#9CA3AF' }}>เต็มเดือน: <strong style={{ color: '#374151', fontFeatureSettings: '"tnum"' }}>{D.fmt.moneyShort(s.prvFull)}</strong></span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

const THAI_MONTH_ABBR = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

// Yearly chart: 12 stacked bars (Amazon + Store + Fuel) for the selected year
function YearlySalesChart({ reports, endDate, compact = false }) {
  const defaultYear = endDate ? parseInt(endDate.slice(0, 4)) : new Date().getFullYear();
  const [selectedYear, setSelectedYear] = React.useState(defaultYear);

  React.useEffect(() => {
    if (endDate) setSelectedYear(parseInt(endDate.slice(0, 4)));
  }, [endDate]);

  const { availableYears, monthData } = React.useMemo(() => {
    if (!reports || !reports.length) return { availableYears: [], monthData: null };
    const years = [...new Set(reports.map(r => parseInt(r.date.slice(0, 4))))].sort();
    const months = Array.from({ length: 12 }, (_, i) => ({ month: i, amazon: 0, store: 0, fuel: 0 }));
    for (const r of reports) {
      if (parseInt(r.date.slice(0, 4)) !== selectedYear) continue;
      const mo = parseInt(r.date.slice(5, 7)) - 1;
      if (mo < 0 || mo > 11) continue;
      if (r.business === 'amazon' && r.parsed && r.parsed.grossSales) months[mo].amazon += r.parsed.grossSales;
      if (r.business === 'store'  && r.parsed && r.parsed.sales)       months[mo].store  += r.parsed.sales;
      if (r.business === 'fuel'   && r.parsed && r.parsed.total && r.parsed.total.amount) months[mo].fuel += r.parsed.total.amount;
    }
    return { availableYears: years, monthData: months };
  }, [reports, selectedYear]);

  const D = window.DASH_DATA;
  const MONTH_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const chartH = compact ? 84 : 110;

  if (!monthData) return (
    <div style={{ textAlign: 'center', fontSize: 12, color: '#9CA3AF', padding: '20px 0' }}>ยังไม่มีข้อมูล</div>
  );

  const maxTotal = Math.max(...monthData.map(m => m.amazon + m.store + m.fuel)) || 1;
  const yearTotal = monthData.reduce((s, m) => s + m.amazon + m.store + m.fuel, 0);
  const canPrev = availableYears.length > 0 && availableYears[0] < selectedYear;
  const canNext = availableYears.length > 0 && availableYears[availableYears.length - 1] > selectedYear;

  return (
    <div>
      {/* Row: legend + year navigator */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {[BIZ.amazon, BIZ.store, BIZ.fuel].map(biz => (
            <div key={biz.key} style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
              <div style={{ width: 8, height: 8, borderRadius: 1, background: biz.color }} />
              <span style={{ fontSize: 9, color: '#6B7280' }}>{biz.th}</span>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
          <button onClick={() => canPrev && setSelectedYear(y => y - 1)}
            style={{ border: 'none', background: 'transparent', fontSize: 15, lineHeight: 1, cursor: canPrev ? 'pointer' : 'default', color: canPrev ? '#374151' : '#D1D5DB', padding: '1px 4px', fontFamily: 'inherit' }}>‹</button>
          <span style={{ fontSize: 11, fontWeight: 700, color: '#111827', minWidth: 68, textAlign: 'center' }}>ปี {selectedYear + 543}</span>
          <button onClick={() => canNext && setSelectedYear(y => y + 1)}
            style={{ border: 'none', background: 'transparent', fontSize: 15, lineHeight: 1, cursor: canNext ? 'pointer' : 'default', color: canNext ? '#374151' : '#D1D5DB', padding: '1px 4px', fontFamily: 'inherit' }}>›</button>
        </div>
      </div>

      {/* Stacked bars */}
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: chartH }}>
        {monthData.map((m, i) => {
          const total = m.amazon + m.store + m.fuel;
          const totalH = total > 0 ? Math.max(3, (total / maxTotal) * chartH) : 2;
          const amzH  = total > 0 ? (m.amazon / total) * totalH : 0;
          const stoH  = total > 0 ? (m.store  / total) * totalH : 0;
          const fulH  = total > 0 ? (m.fuel   / total) * totalH : 0;
          return (
            <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
              <div
                title={`${MONTH_EN[i]} ${selectedYear}\nAmazon: ${D.fmt.moneyShort(m.amazon)}\nStore: ${D.fmt.moneyShort(m.store)}\nFuel: ${D.fmt.moneyShort(m.fuel)}\nรวม: ${D.fmt.moneyShort(total)}`}
                style={{ width: '86%', height: totalH, display: 'flex', flexDirection: 'column', borderRadius: '2px 2px 0 0', overflow: 'hidden', cursor: 'default' }}>
                <div style={{ height: amzH, background: BIZ.amazon.color, flexShrink: 0 }} />
                <div style={{ height: stoH, background: BIZ.store.color,  flexShrink: 0 }} />
                <div style={{ height: fulH, background: BIZ.fuel.color,   flexShrink: 0 }} />
              </div>
            </div>
          );
        })}
      </div>

      {/* Month labels */}
      <div style={{ display: 'flex', gap: 2, marginTop: 4 }}>
        {MONTH_EN.map((l, i) => (
          <div key={i} style={{ flex: 1, textAlign: 'center', fontSize: 8, color: '#9CA3AF' }}>{l}</div>
        ))}
      </div>

      {/* Year total */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8, paddingTop: 8, borderTop: '1px dashed #E5E7EB', fontSize: 10 }}>
        <span style={{ color: '#6B7280' }}>รวมทั้งปี {selectedYear + 543}</span>
        <span style={{ fontWeight: 700, color: '#111827', fontFeatureSettings: '"tnum"' }}>{D.fmt.moneyShort(yearTotal)}</span>
      </div>
    </div>
  );
}

// ─── Auth ─────────────────────────────────────────────────────────────────────
// Password is stored as SHA-256 so the plaintext is never in source.
// Default password: ptt2569
// To change: compute sha256("newPassword") and replace PW_HASH below.
const PW_HASH = '5ace477963752ce3b5e02b664b5ee9d878d20706584f406811566432e540d5d2';
const AUTH_KEY  = 'ptt_auth_v1';
const AUTH_TTL  = 24 * 60 * 60 * 1000; // 24 hours

async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function saveSession()    { localStorage.setItem(AUTH_KEY, JSON.stringify({ ts: Date.now() })); }
function clearSession()   { localStorage.removeItem(AUTH_KEY); }
function isSessionValid() {
  try { const { ts } = JSON.parse(localStorage.getItem(AUTH_KEY)); return Date.now() - ts < AUTH_TTL; }
  catch { return false; }
}

  // Expose logout globally so TopBar / MobileHeader can call it
  React.useEffect(() => {
    window.__pttLogout = () => { clearSession(); setAuthed(false); };
    return () => { delete window.__pttLogout; };
  }, []);

  React.useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${MOBILE_BREAKPOINT - 1}px)`);
    const handler = (e) => setIsMobile(e.matches);
    mq.addEventListener ? mq.addEventListener('change', handler) : mq.addListener(handler);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', handler) : mq.removeListener(handler); };
  }, []);

  if (!authed) return <LoginScreen onLogin={() => setAuthed(true)} />;

  return (
    <React.Fragment>
      {isMobile
        ? <DashboardMobile dateState={dateState} />
        : <DashboardV2 dateState={dateState} />}
      <AddDataButton onClick={() => setModalOpen(true)} mobile={isMobile} />
      <AddDataModal open={modalOpen} onClose={() => setModalOpen(false)} />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
